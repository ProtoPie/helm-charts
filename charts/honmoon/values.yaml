# Defaults for the honmoon chart. Every environment-specific value lives in the
# consuming repo's values file (staging-eks: dev-honmoon/honmoon.values.yaml) —
# nothing here should be env-specific, so a missing override fails loudly rather
# than silently deploying dev settings somewhere else.

# Namespace every resource is pinned to, and the Namespace object this chart
# creates. Set explicitly instead of relying on the release namespace so the
# rendered output is identical no matter how helm/argocd is invoked.
namespace: honmoon

# Applied to api, web and the sf-sync CronJob. Empty = no constraint.
# staging pins arm64 because the dev images are built arm64-only.
nodeSelector: {}

image:
  # `tag` carries the digest too, e.g. `api-latest@sha256:...` — that is the
  # shape argocd-image-updater writes under `update-strategy: digest`, and the
  # templates render "<repository>:<tag>" (a tag is ignored when a digest is
  # present). api and web MUST stay separate values paths: they share one ECR
  # repository, and image-updater collides on shared image names when the two
  # targets are not independently addressable (that collision is exactly why
  # this chart replaced the kustomize overlay).
  api:
    repository: ""
    tag: ""
    pullPolicy: Always
  web:
    repository: ""
    tag: ""
    pullPolicy: Always

api:
  replicas: 1
  serviceAccount:
    # IRSA role granting s3:PutObject on the license-artifact bucket.
    roleArn: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  # Ingress class. Defaults to EMPTY (no spec.ingressClassName) on purpose: a
  # values file that fails to apply must not stamp a class onto a live Ingress —
  # on prod-oregon the class is selected by the `kubernetes.io/ingress.class: alb`
  # annotation, and adding spec.ingressClassName to an existing ALB Ingress
  # recreates the load balancer (new DNS name). dev sets `nginx` explicitly.
  className: ""
  host: ""
  # Extra metadata.annotations (ALB scheme/cert/healthcheck etc.). Empty = none.
  annotations: {}

sfSync:
  schedule: "0 * * * *"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

externalSecrets:
  refreshInterval: 1h
  storeName: aws-parameter-store
  # SSM path prefix; each key below is pulled from <ssmPrefix>/<KEY>.
  ssmPrefix: ""
  keys: []

# ConfigMap `honmoon-config` contents, injected wholesale via envFrom.
config: {}

# In-cluster PostgreSQL (StatefulSet `postgres` + headless Service + init.sql
# ConfigMap) for environments WITHOUT an external DB — prod-oregon runs this;
# dev uses an external DB. The manifests mirror the enterprise-eks kustomize
# base this chart replaced (2026-09-15), so the live StatefulSet is adopted
# without a spec diff: serviceName, selector and volumeClaimTemplates are
# immutable, and a change there would force a delete/recreate of the data
# volume's owner. Credentials come from the `honmoon-secret` keys DB_USER /
# DB_PASSWORD (same secret the api uses).
#
# `enabled` has NO default and MUST be set by every consumer (true = in-cluster
# DB, false = external DB): the chart fails to render otherwise. Under an
# ArgoCD app with prune, a values file that silently fails to apply would
# otherwise flip this to false and PRUNE THE PRODUCTION DATABASE's StatefulSet.
# The StatefulSet also carries `argocd.argoproj.io/sync-options: Prune=false`
# as a second line of defence.
postgres:
  # enabled: <required>
  image: postgres:16-alpine
  # Role that owns the schema; init.sql grants it everything. Must equal DB_USER.
  user: honmoon
  # Database AND schema name (prod uses the same string for both).
  database: enterprise-license
  storageClassName: gp3
  storage: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
