{{- if .Values.connect.enabled }}
{{- if not .Values.connect.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: connect-app-secret
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-server
type: Opaque
{{- with .Values.connect.secretEnv }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
