{{- /* Rendered whether or not connect.enabled (PS-2925): cloud-api reads
       PPC_CLOUD_SERVICE_KEY from this Secret as CONNECT_SERVICE_KEY once at
       boot, so it must exist before CoC is turned on. */}}
{{- if not .Values.connect.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: connect-app-secret
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-server
type: Opaque
{{- with .Values.connect.secretEnv }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
