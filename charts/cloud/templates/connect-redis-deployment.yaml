{{- if .Values.connect.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-redis
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connect-redis
  template:
    metadata:
      labels:
        app: connect-redis
    spec:
      {{- include "cloud.computeScheduling" . | nindent 6 }}
      containers:
        - name: redis
          image: "{{ .Values.connect.redis.image.repository }}:{{ .Values.connect.redis.image.tag }}"
          imagePullPolicy: {{ .Values.connect.redis.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - --save
            - "60"
            - "1000"
            - --loglevel
            - "notice"
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.connect.redis.resources | nindent 12 }}
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
{{- end }}
