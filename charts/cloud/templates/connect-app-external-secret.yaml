{{- if .Values.connect.enabled }}
{{- if .Values.connect.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: connect-app-secret
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-server
spec:
  refreshInterval: {{ .Values.connect.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.connect.externalSecrets.secretStoreRef.name | default "aws-parameter-store" }}
    kind: {{ .Values.connect.externalSecrets.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: connect-app-secret
    creationPolicy: Owner
  data:
    {{/* sharedRefs[$key] overrides with a full SSM path (e.g. PPC_CLOUD_JWT_SECRET
         must equal cloud-api's PP_SECRET, so it points at the shared parameter);
         otherwise the key resolves under ssmPathPrefix. */}}
    {{- $shared := .Values.connect.externalSecrets.sharedRefs | default dict }}
    {{- $prefix := required "connect.externalSecrets.ssmPathPrefix is required when connect.externalSecrets.enabled=true" .Values.connect.externalSecrets.ssmPathPrefix }}
    {{- range $key, $value := .Values.connect.secretEnv }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $shared $key | default (printf "%s/%s" $prefix $key) }}
    {{- end }}
{{- end }}
{{- end }}
