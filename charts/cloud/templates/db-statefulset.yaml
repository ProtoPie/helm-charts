{{- if and (not .Values.postgresql.enabled) (ne ((.Values.image.db).flavor | default "bitnami") "upstream") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:  db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app:  db
  template:
    metadata:
      labels:
        app:  db
    spec:
      containers:
      - name:  db
        image: "{{ .Values.image.db.repository }}:{{ .Values.image.db.tag }}"
        imagePullPolicy: {{ .Values.image.db.pullPolicy }}
        ports:
        - containerPort: 5432
          name:  db
        env:
        - name: POSTGRESQL_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: username
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: password
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: database
        - name: DB_DATABASE_ANALYTICS
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: analytics-database
        - name: DB_READ_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: read-user
        - name: DB_WRITE_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: write-user
        - name: DB_READ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: read-password
        - name: DB_WRITE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: write-password
        {{- if .Values.db.extra.envs }}
        {{- toYaml .Values.db.extra.envs | nindent 8 }}
        {{- end }}
        {{- with .Values.db.readinessProbe }}
        # Gate the `db` Service endpoint on Postgres actually accepting
        # connections. Without this the endpoint is published the moment the
        # container starts, so on a scale-to-zero wake cloud-api connects into a
        # postmaster that is still running WAL recovery and dies at
        # `[Init] Start db migration.` (observed: `Connection refused` and
        # `FATAL: the database system is starting up`).
        readinessProbe:
          {{- if not .exec }}
          # -h /tmp uses the local Unix socket, so readiness reports on this
          # postmaster only and never depends on cluster DNS or the Service.
          exec:
            command:
              - /bin/sh
              - -c
              - exec pg_isready -U {{ $.Values.db.env.POSTGRES_USER | quote }} -d {{ $.Values.db.env.DB_DATABASE | quote }} -h /tmp -q
          {{- end }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.db.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.db.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: pg-data
          mountPath: /bitnami/postgresql/data
        - name: db-initialize
          mountPath: /docker-entrypoint-initdb.d
        {{- if .Values.db.resources}}
        resources: {{- toYaml .Values.db.resources | nindent 10 }}
        {{- end }}
      volumes:
        - name: db-initialize
          configMap:
            name: postgres-init-script-configmap
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: pg-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.db.volume }}
      {{- if .Values.db.storageClassName }}
      storageClassName: {{ .Values.db.storageClassName }}
      {{- end }}
{{- end }}
