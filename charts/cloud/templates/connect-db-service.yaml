{{- if .Values.connect.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: connect-db
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-db
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    app: connect-db
{{- end }}
