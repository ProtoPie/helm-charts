apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-wake
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
data:
  wake.html: |
    <!doctype html>
    <html lang="ko">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>환경을 깨우는 중…</title>
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
             background:#111318; color:#e8eaed; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif; }
      .card { max-width:26rem; padding:2.5rem 2rem; text-align:center; }
      .spinner { width:2.5rem; height:2.5rem; margin:0 auto 1.5rem; border-radius:50%;
                 border:3px solid #2e3340; border-top-color:#7aa2ff; animation:spin 0.9s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      h1 { font-size:1.15rem; font-weight:600; margin:0 0 0.75rem; }
      p { font-size:0.9rem; line-height:1.55; color:#b6bac4; margin:0 0 0.75rem; }
      .elapsed { font-variant-numeric:tabular-nums; color:#7d818c; font-size:0.8rem; }
      .en { color:#7d818c; font-size:0.8rem; }
      #manual { display:none; }
      #manual a { color:#7aa2ff; }
    </style>
    </head>
    <body>
    <div class="card">
      <div class="spinner" id="sp"></div>
      <h1>환경을 깨우는 중입니다</h1>
      <p>비용 절감을 위해 잠들어 있던 환경을 다시 시작하고 있어요.<br>
         보통 1~3분 정도 걸리며, 준비되면 자동으로 이동합니다.</p>
      <p class="elapsed">경과 <span id="t">0</span>초</p>
      <p class="en">Waking this environment up — usually takes 1–3 minutes.<br>The page will move on automatically once it is ready.</p>
      <p id="manual">자동 확인이 중단되었습니다. <a href="/">여기를 눌러 다시 시도</a>해 주세요.</p>
    </div>
    <script>
    (function () {
      var sec = 0;
      var MAX_SEC = 900; // 15분 뒤 폴링 중단 — 폴링 자체가 트래픽으로 잡혀 환경이 못 잠드는 것 방지
      var timer = setInterval(function () {
        sec += 1;
        document.getElementById('t').textContent = sec;
      }, 1000);
      function stopPolling() {
        clearInterval(timer);
        document.getElementById('sp').style.display = 'none';
        document.getElementById('manual').style.display = 'block';
      }
      function poll() {
        if (sec >= MAX_SEC) { stopPolling(); return; }
        fetch('/_wake/health', { cache: 'no-store' })
          .then(function (r) { if (r.ok) { location.replace('/'); } else { setTimeout(poll, 4000); } })
          .catch(function () { setTimeout(poll, 4000); });
      }
      setTimeout(poll, 3000);
    })();
    </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: {{ .Values.nginx.replicas }}
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      annotations:
        checksum/nginx-conf: {{ printf "%s%s%s%s%s" (.Values.cloud.host | toString) (.Values.cloud.api.featureFlag | toString) (.Values.userTesting | toYaml) (.Values.analytics | toYaml) (.Values.cloud.share | toYaml) | sha256sum }}
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
        imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
        ports:
          - name: http
            containerPort: 80
            protocol: TCP
        # 자체 헬스 엔드포인트 사용 — `/`(web 프록시)에 묶으면 wake 중 nginx가
        # Ready가 되지 못해 안내 페이지를 서빙할 수 없다.
        livenessProbe:
          httpGet:
            path: /_nginx-healthz
            port: http
        readinessProbe:
          httpGet:
            path: /_nginx-healthz
            port: http
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx # mount nginx-conf volume to /etc/nginx
          readOnly: true
        - name: wake
          mountPath: /usr/share/nginx/wake
          readOnly: true
        {{- if .Values.cloud.wellKnown.enabled }}
        - name: html
          mountPath: /usr/share/nginx/html
        {{- end }}
        - name: log
          mountPath: /var/log/nginx
      {{- include "cloud.computeScheduling" . | nindent 6 }}
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-conf # place ConfigMap `nginx-conf` on /etc/nginx
          items:
            - key: nginx.conf
              path: nginx.conf
            - key: virtualhost.conf
              path: virtualhost/virtualhost.conf # dig directory
      - name: wake
        configMap:
          name: nginx-wake
      {{- if .Values.cloud.wellKnown.enabled }}
      - name: html
        configMap:
          name: html
          items:
            - key: appleAppSiteAssociation
              path: .well-known/apple-app-site-association
            - key: assetlinks.json
              path: .well-known/assetlinks.json
      {{- end }}
      - name: log
        emptyDir: {}
