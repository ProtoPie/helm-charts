apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
data:
  nginx.conf: |
    #user root;
    error_log  /dev/stderr;
    worker_processes  1;
    events {
      worker_connections  1024;
    }

    http {
      client_max_body_size        3G;
      client_header_timeout       600s;
      client_body_timeout         600s;
      proxy_connect_timeout       600s;
      proxy_send_timeout          600s;
      proxy_read_timeout          600s;
      send_timeout                600s;
      large_client_header_buffers 8 16k;

      log_format  main
              'remote_addr:$remote_addr\t'
              'time_local:$time_local\t'
              'method:$request_method\t'
              'uri:$request_uri\t'
              'host:$host\t'
              'status:$status\t'
              'bytes_sent:$body_bytes_sent\t'
              'referer:$http_referer\t'
              'useragent:$http_user_agent\t'
              'forwardedfor:$http_x_forwarded_for\t'
              'request_time:$request_time';
      access_log  /dev/stdout;

      include /etc/nginx/virtualhost/virtualhost.conf;
    }

  virtualhost.conf: |
    upstream web_server {
      server ent-cloud-web-svc.{{ .Release.Namespace }}.svc.cluster.local;
    }

    {{- if and .Values.userTesting.enabled .Values.userTesting.useLegacy }}
    upstream user-testing-api_server {
      server ent-cloud-ut-svc.{{ .Release.Namespace }}.svc.cluster.local;
    }
    upstream user-testing-socket_server {
      server ent-cloud-ut-svc.{{ .Release.Namespace }}.svc.cluster.local:8081;
    }
    {{- end }}

    {{- if and .Values.userTesting.enabled (not .Values.userTesting.useLegacy) }}
    upstream user_testing_server {
      server user-testing-server.{{ .Release.Namespace }}.svc.cluster.local:3030;
    }
    {{- end }}

    upstream api_server {
      server ent-cloud-api-svc.{{ .Release.Namespace }}.svc.cluster.local;
    }

    {{- if .Values.analytics.enabled }}
    upstream analytics-web_server {
      server ent-analytics-web-svc.{{ .Release.Namespace }}.svc.cluster.local;
    }

    upstream analytics-api_server {
      server ent-analytics-api-svc.{{ .Release.Namespace }}.svc.cluster.local;
    }
    {{- end }}

    # gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 8192;
    gzip_types  text/plain text/css application/json application/javascript
                application/x-javascript text/xml application/xml
                application/xml+rss text/javascript application/font-woff2
                application/font-woff;
    # security
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=15768000";
    server_tokens off;

    # proxy
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host				$host;
    proxy_set_header X-Real-IP			$remote_addr;
    proxy_set_header X-Forwarded-For	$proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy      true;

    # outdated agents
    map $http_user_agent $outdated {
        default                                                     0;
        "~MSIE [1-9]\."                                             1;
        "~MSIE 1[0-1]\."                                            1;
        "~Trident/[5-7]\."                                          1;
        "~Edge/1[0-7]\."                                            1;
        "~Mozilla.*Firefox/5[0-9]\."                                1;
        "~Mozilla.*Firefox/6[0-5]\."                                1;
        "~Opera.*Version/2[0-9]\."                                  1;
        "~Chrome/5[0-9]\."                                          1;
        "~Chrome/6[0-3]\."                                          1;
        "~.*(?=.Mac OS X).*(AppleWebKit.*Version\/[0-8]\..*Safari)" 1;
    }

    # For Websocket (User Research)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;

        # scale-to-zero wake UX: 백엔드가 깨어나는 동안 502 대신 안내 페이지를 서빙하고,
        # api가 준비되면 페이지가 스스로 새로고침한다.
        proxy_intercept_errors on;
        error_page 502 503 504 /_wake/wake.html;

        # nginx 자체 헬스체크 — probe가 upstream(web)에 묶이면 wake 중 nginx가
        # Ready가 되지 못해 안내 페이지 자체를 서빙할 수 없다.
        location = /_nginx-healthz {
            access_log off;
            return 200 "ok";
        }

        # 안내 페이지가 폴링하는 api 준비 상태 (200 = ready)
        location = /_wake/health {
            access_log off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            add_header Cache-Control "no-store";
            proxy_pass http://api_server/;
        }

        # 안내 페이지 정적 파일. CM 마운트 구성이라 mime.types가 없으므로
        # text/html을 명시해야 한다.
        location ^~ /_wake/ {
            types { } default_type text/html;
            add_header Cache-Control "no-store";
            add_header Retry-After "10";
            alias /usr/share/nginx/wake/;
        }

        # redirect to web — 루트 문서는 api 준비 여부(auth_request)로 게이트해서,
        # 앱 셸만 뜨고 api 호출이 전부 실패하는 "무한 스피너" 대신 안내 페이지를 낸다.
        location = / {
            auth_request /_wake_check;
            error_page 500 502 503 504 /_wake/wake.html;
            proxy_pass http://web_server;
        }

        location = /_wake_check {
            internal;
            access_log off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://api_server/;
        }

        # redirect to web
        location / {
            proxy_pass http://web_server;
        }

        # redirect to api
        location /api {
            proxy_set_header X-API-Prefix /api;
            {{- if .Values.cloud.api.featureFlag }}
            proxy_set_header X-feature-flag on;
            {{- end }}
            rewrite ^/api/?(.*) /$1 break;
            proxy_pass http://api_server/;
        }

        location /api/v1 {
            proxy_set_header X-API-Prefix /api/v1;
            rewrite ^/api/v1/?(.*) /$1 break;
            proxy_pass http://api_server/;
        }

        location /api/v2 {
            proxy_set_header X-API-Prefix /api/v2;
            rewrite ^/api/v2/?(.*) /$1 break;
            proxy_pass http://api_server/;
        }

        # redirect to api - from Studio >=7.0
        location /api/v3 {
            proxy_set_header X-API-Prefix /api/v3;
            rewrite ^/api/v3/?(.*) /$1 break;
            proxy_pass http://api_server/;
        }

        {{- if and .Values.userTesting.enabled .Values.userTesting.useLegacy }}
        # Legacy User Testing (Kotlin/KTOR) - WebSocket endpoint
        location ^~ /user-research/socket {
            rewrite ^/user-research/(.*)$ /$1 break;
            proxy_pass http://user-testing-socket_server;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Legacy User Testing (Kotlin/KTOR) - API endpoint
        location ^~ /user-research {
            rewrite ^/user-research/(.*)$ /$1 break;
            proxy_pass http://user-testing-api_server;
        }
        {{- end }}

        {{- if and .Values.userTesting.enabled (not .Values.userTesting.useLegacy) }}
        # User Testing Server - WebSocket endpoint
        location ^~ /api/ut/socket.io/ {
            proxy_pass http://user_testing_server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Testing Server - REST API endpoint
        location ^~ /api/ut/ {
            proxy_pass http://user_testing_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /api/ut;
        }
        {{- end }}

        {{- if .Values.analytics.enabled }}
        # analytics dashboard
        location /analytics {
            proxy_pass http://analytics-web_server/analytics;
        }

        location /api/analytics/ {
            proxy_pass http://analytics-api_server/;
        }
        {{- end }}

        # robots.txt
        location = /robots.txt {
            root /usr/share/nginx/html/;
        }

        # static pages
        location ~ ^/(.well-known|outdated)/ {
            root /usr/share/nginx/html/;
        }

        # redirect as outdated browser has been connected
        if ($outdated = 1) {
            rewrite ^ /outdated/outdated.html;
        }
    }

    {{- if .Values.cloud.share.enabled }}
    server {
        #
        listen 80;
        server_name {{ .Values.cloud.share.host }};

        # robots.txt
        location = /robots.txt {
            root /usr/share/nginx/html/;
        }

        # static pages
        location ~ ^/(.well-known|outdated)/ {
            root /usr/share/nginx/html/;
        }

        # redirect to web - from Pie Share
        location / {
            rewrite ^/?(.*)$ https://{{ .Values.cloud.host }}/p/$1 permanent;
        }
    }

    {{- end }}
---
