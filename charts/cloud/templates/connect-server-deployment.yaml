{{- if .Values.connect.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect-server
  labels:
    {{- include "protopie.labels" . | nindent 4 }}
    app: connect-server
spec:
  replicas: {{ .Values.connect.replicas | default 1 }}
  # connect-data PVC is RWO (EBS): RollingUpdate deadlocks on Multi-Attach —
  # the new pod cannot attach the volume while the old pod still holds it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: connect-server
  template:
    metadata:
      labels:
        app: connect-server
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/connect-config-configmap.yaml") . | sha256sum }}
        checksum/db-secret: {{ include (print $.Template.BasePath "/connect-db-secret.yaml") . | sha256sum }}
        checksum/app-secret: {{ include (print $.Template.BasePath "/connect-app-secret.yaml") . | sha256sum }}
    spec:
      {{- include "cloud.computeScheduling" . | nindent 6 }}
      {{- with .Values.connect.server.podSecurityContext }}
      # Fresh PVCs are root-owned while the image runs as uid 1000 (node), so
      # mkdir under /data fails with EACCES unless fsGroup realigns the volume.
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- .Values.imagePullSecrets | toYaml | nindent 8 }}
      {{- else if .Values.imageCredentials }}
      imagePullSecrets:
      - name: protopie-private-registry
      {{- end }}
      {{- if .Values.connect.server.waitForDb.enabled }}
      # Same wake race as cloud-api: the entrypoint runs `prisma migrate deploy`
      # before serving and exits 1 on the first failure, so a simultaneous KEDA
      # 0->1 of connect-db and connect-server crash-loops the server
      # (observed in f2-ee: `P1001: Can't reach database server at
      # connect-db:5432`, 3 restarts). Uses the connect-db image for pg_isready.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.connect.db.image.repository }}:{{ .Values.connect.db.image.tag }}"
          imagePullPolicy: {{ .Values.connect.db.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              deadline=$(( $(date +%s) + {{ .Values.connect.server.waitForDb.timeoutSeconds }} ))
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -q; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "wait-for-db: ${DB_HOST}:${DB_PORT} not ready after {{ .Values.connect.server.waitForDb.timeoutSeconds }}s"
                  exit 1
                fi
                echo "wait-for-db: waiting for ${DB_HOST}:${DB_PORT} ..."
                sleep {{ .Values.connect.server.waitForDb.periodSeconds }}
              done
              echo "wait-for-db: ${DB_HOST}:${DB_PORT} is accepting connections"
          env:
            - name: DB_HOST
              value: {{ .Values.connect.db.host | default "connect-db" | quote }}
            - name: DB_PORT
              value: {{ .Values.connect.db.port | default "5432" | quote }}
            - name: DB_USER
              value: {{ .Values.connect.db.user | quote }}
            - name: DB_NAME
              value: {{ .Values.connect.db.database | quote }}
          resources:
            {{- toYaml .Values.connect.server.waitForDb.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: connect-server
          image: "{{ .Values.connect.server.image.repository }}:{{ .Values.connect.server.image.tag }}"
          imagePullPolicy: {{ .Values.connect.server.image.pullPolicy | default "Always" }}
          ports:
            - name: http
              containerPort: {{ .Values.connect.server.port | default 3033 }}
              protocol: TCP
          env:
            # Override the image default PPC_HOST_BIND=127.0.0.1 so the app binds
            # all interfaces and the ClusterIP Service can route to the pod.
            - name: PPC_HOST_BIND
              value: {{ .Values.connect.server.hostBind | default "0.0.0.0" | quote }}
            # The app rejects PPC_HOST_BIND=0.0.0.0 unless bind-all is explicitly
            # allowed; in k8s the pod network is isolated so all-interfaces is
            # required for the Service to reach it.
            - name: PPC_ALLOW_BIND_ALL
              value: {{ .Values.connect.server.allowBindAll | default "1" | quote }}
          # Non-secret config from connect-config (ConfigMap) and secrets from
          # connect-app-secret (inline, or SSM when externalSecrets.enabled=true).
          envFrom:
            - configMapRef:
                name: connect-config
            - secretRef:
                name: connect-app-secret
          livenessProbe:
            httpGet:
              path: {{ .Values.connect.server.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.connect.server.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.connect.server.resources | nindent 12 }}
          {{- if .Values.connect.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.connect.persistence.mountPath | default "/data" }}
          {{- end }}
      {{- if .Values.connect.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: connect-data
      {{- end }}
{{- end }}
