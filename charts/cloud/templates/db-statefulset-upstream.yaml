{{- if and (not .Values.postgresql.enabled) (eq ((.Values.image.db).flavor | default "bitnami") "upstream") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: db
    spec:
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: Always
      containers:
      - name: db
        image: "{{ .Values.image.db.repository }}:{{ .Values.image.db.tag }}"
        imagePullPolicy: {{ .Values.image.db.pullPolicy }}
        securityContext:
          runAsUser: 70
          runAsGroup: 70
          runAsNonRoot: true
        ports:
        - containerPort: 5432
          name: db
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "protopie.db.secretName" . }}
              key: password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: database
        - name: PGDATA
          value: /var/lib/postgresql/data
        {{- if .Values.db.extra.envs }}
        {{- toYaml .Values.db.extra.envs | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: pg-data
          mountPath: /var/lib/postgresql/data
        - name: db-initialize
          mountPath: /docker-entrypoint-initdb.d
        {{- if .Values.db.resources}}
        resources: {{- toYaml .Values.db.resources | nindent 10 }}
        {{- end }}
      volumes:
        - name: db-initialize
          configMap:
            name: postgres-init-script-configmap
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: pg-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: {{ .Values.db.volume }}
      {{- if .Values.db.storageClassName }}
      storageClassName: {{ .Values.db.storageClassName }}
      {{- end }}
{{- end }}
