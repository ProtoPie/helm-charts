name: Release Charts

on:
  push:
    branches:
      - main
  # Manual re-run without a commit — needed to capture a fresh failure log
  # (runs older than the retention window return HTTP 410).
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write # to push chart release and create a release (helm/chart-releaser-action)

    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # chart-releaser diffs charts/ against the latest release tag, so it
          # needs the full history and all tags (the previous shallow checkout +
          # `git fetch --unshallow` is what upstream's example replaces with this).
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3.5
        with:
          version: v3.12.0

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        with:
          # cr.yaml → skip-existing: true. Every run since 2025-10 failed because
          # charts/cloud changed without a version bump: cr re-packaged cloud-3.2.1,
          # `cr upload` hit the already-existing release and aborted (errexit)
          # before ever reaching the other charts — honmoon 0.1.0 was never
          # published. With skip-existing an already-released version is skipped
          # and the rest of the charts are still uploaded and indexed.
          config: cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
